name: Build and deploy AMIPARKN 3D website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract website project
        run: unzip -q AMIPARKN-3D-Website-DEPLOY.zip

      - name: Install dependencies
        working-directory: apex-3d-site-main
        run: npm ci

      - name: Build website
        working-directory: apex-3d-site-main
        run: npm run build

      - name: Add legal pages and preserve custom domain
        working-directory: apex-3d-site-main
        run: |
          mkdir -p dist/src
          cp impressum.html privacy.html dist/
          cp src/style.css dist/src/style.css
          cp ../CNAME dist/CNAME
          if [ -f ../favicon.svg ]; then cp ../favicon.svg dist/favicon.svg; fi
          if [ -f ../404.html ]; then cp ../404.html dist/404.html; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apex-3d-site-main/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
