<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIPARKN - Intelligente Parkplatz-Plattform (Beta)</title>
    <!-- افزودن فونت مدرن Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
            scroll-behavior: smooth; /* اسکرول نرم */
        }

        body {
            background-color: #0b0f19; /* پس‌زمینه بسیار تیره */
            color: #f3f4f6;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* انیمیشن‌های ورود صفحه */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* بنر اطلاع‌رسانی بتا */
        .beta-banner {
            background: linear-gradient(90deg, #ff9900, #ff5500);
            color: #000;
            text-align: center;
            padding: 8px 15px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1001;
            box-shadow: 0 2px 10px rgba(255, 85, 0, 0.3);
        }

        /* هدر شیشه‌ای (Glassmorphism) */
        header {
            position: fixed;
            top: 33px; /* زیر بنر بتا */
            left: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(15px); /* افکت تاری */
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
        }

        /* برندینگ اختصاصی با حرف N قرمز */
        .brand-text {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .highlight-n {
            color: #ff3b30 !important;
            -webkit-text-fill-color: #ff3b30 !important;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255, 59, 48, 0.8); /* درخشش نئونی */
        }

        .beta-badge {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.3);
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            padding: 12px 26px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.5);
        }

        /* کانتینر مدل سه‌بعدی */
        .hero-container {
            position: relative;
            width: 100%;
            height: 70vh; /* کمی بلندتر */
            margin-top: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .spline-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* محتوای اصلی معرفی */
        .main-content {
            max-width: 900px;
            margin: -40px auto 100px auto; /* فاصله منفی برای رفتن روی مدل */
            text-align: center;
            padding: 0 20px;
            position: relative;
            z-index: 10;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        h1 {
            font-size: 3.2rem; /* بزرگتر و خواناتر */
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 25px;
            letter-spacing: -1.5px;
            line-height: 1.2;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: #9ca3af;
            max-width: 700px;
            margin: 0 auto 40px auto;
            font-weight: 400;
        }

        /* استایل مشترک بخش‌ها */
        .how-it-works-section, .faq-section {
            max-width: 1100px;
            margin: 0 auto 120px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 60px;
            color: #ffffff;
            text-align: center;
            position: relative;
        }

        /* خط تزیینی زیر عنوان */
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border-radius: 2px;
        }

        /* گرید نحوه کار */
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
        }

        /* کارت شیشه‌ای و مدرن (Glass Card) */
        .step-card {
            background: rgba(22, 27, 34, 0.5); /* نیمه شفاف */
            border: 1px solid rgba(255, 255, 255, 0.05); /* مرز بسیار نازک */
            border-radius: 24px;
            padding: 40px 25px;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* انیمیشن خاص */
            overflow: hidden;
        }

        /* نور پس‌زمینه کارت هنگام هاور */
        .step-card::after {
            content: '';
            position: absolute;
            top: 150%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: rgba(79, 172, 254, 0.2);
            border-radius: 50%;
            filter: blur(40px);
            transition: all 0.5s ease;
            z-index: -1;
        }

        .step-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(79, 172, 254, 0.3);
            background: rgba(22, 27, 34, 0.7);
        }

        .step-card:hover::after {
            top: 110%; /* بالا آمدن نور */
        }

        .step-number {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
        }

        .step-icon {
            font-size: 3rem;
            margin-bottom: 25px;
            display: inline-block;
        }

        .step-card h3 {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .step-card p {
            font-size: 0.95rem;
            color: #9ca3af;
            font-weight: 400;
        }

        /* استایل FAQ اختصاصی */
        .faq-grid {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background: rgba(22, 27, 34, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-bottom: 18px;
            padding: 25px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .faq-item:hover {
            background: rgba(22, 27, 34, 0.7);
            border-color: rgba(79, 172, 254, 0.2);
            transform: translateX(5px);
        }

        .faq-question {
            font-size: 1.15rem;
            font-weight: 700;
            color: #4facfe; /* رنگ اصلی */
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .faq-answer {
            color: #d1d5db;
            font-size: 1rem;
            padding-left: 32px; /* هم‌ترازی با آیکون */
        }

        .faq-answer strong {
            color: #00f2fe; /* برجسته کردن اعداد استرداد */
        }

        /* فوتر حرفه‌ای */
        footer {
            background: #07090f;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .footer-logo {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 15px;
            display: inline-block;
        }

        .footer-links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .footer-links a {
            color: #9ca3af;
            text-decoration: none;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .footer-links a:hover {
            color: #00f2fe;
            transform: translateY(-1px);
        }

        /* بهینه‌سازی برای موبایل */
        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .hero-container { height: 50vh; }
            header { padding: 10px 5%; }
            .nav-btn { padding: 10px 20px; font-size: 0.85rem; }
            .section-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

        <a href="#how-it-works" class="nav-btn">Entdecken</a>

    <div class="hero-container">

    <div class="how-it-works-section
